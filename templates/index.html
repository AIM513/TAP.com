<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAP.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
<style nonce="{{ csp_nonce() }}">
  .hidden { display:none !important; }
  .tap-badge {
    background-color: #2d6a4f;
    color: #ffffff;
    padding: 2px 10px;
    border-radius: 6px;
    font-weight: 700;
    display: inline-block;
    letter-spacing: 0.5px;
  }
  select {
    flex: none;
    max-width: 160px;
    border: 1px solid #dfe8e2;
    border-radius: 13px;
    outline: 0;
    background: #fff;
    color: #17231f;
    padding: 13px 14px;
    font: inherit;
  }
  .dest-form { margin-top: 14px; }
  .lang-picker { position: absolute; top: 0; right: 0; }
  .lang-picker select { max-width: 150px; padding: 9px 12px; }
</style>
</head>
<body>
<div class="helper-shell">
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="lang-picker">
    <select id="lang" aria-label="Language">
      <option value="">English</option>
      <option value="hi">Hindi</option>
      <option value="bn">Bengali</option>
      <option value="ta">Tamil</option>
      <option value="te">Telugu</option>
      <option value="mr">Marathi</option>
      <option value="gu">Gujarati</option>
      <option value="pa">Punjabi</option>
      <option value="ur">Urdu</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="pt">Portuguese</option>
      <option value="it">Italian</option>
      <option value="nl">Dutch</option>
      <option value="ru">Russian</option>
      <option value="ar">Arabic</option>
      <option value="zh-CN">Chinese (Simplified)</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
    </select>
  </div>
  <main class="helper-wrap">
    <header class="hero">
        <div>
        <p class="eyebrow notranslate">TAP.com</p>
        <h1><span data-i18n="h1">Use any website in</span> <span class="nowrap"><span data-i18n="h1one">one</span> <span class="tap-badge notranslate">TAP</span></span></h1>
        <p class="sub" data-i18n="sub">Type a website, then tap a big button or say what you want in 1–2 words.</p>
      </div>
    </header>

    <section class="search-panel">
      <form id="siteForm" class="url-form">
        <label for="url" data-i18n="label_site">Website address</label>
        <div class="input-row">
          <input id="url" data-i18n-ph="ph_url" placeholder="e.g. passportindia.gov.in" value="python.org" autocomplete="off">
          <button class="primary-button" data-i18n="open">Open</button>
        </div>
      </form>
      <div class="chips">
        <button class="chip" data-url="python.org">python.org</button>
        <button class="chip" data-url="wikipedia.org">wikipedia.org</button>
        <button class="chip" data-url="github.com">github.com</button>
        <button class="chip" data-url="usa.gov">usa.gov</button>
        <button class="chip" data-url="https://www.passportindia.gov.in/psp">Passport Seva</button>
      </div>
      <p id="error" class="error"></p>
    </section>

    <div id="panel" class="content-stack hidden">
      <section class="card">
        <div class="section-heading">
          <span class="step">1</span>
          <div><h2 data-i18n="ask_h">What do you want to do?</h2><p data-i18n="ask_p">Type 1–2 words, like apply, status or fees.</p></div>
        </div>
        <form id="askForm" class="input-row">
          <input id="ask" data-i18n-ph="ph_ask" placeholder="e.g. login, pay bill, jobs" aria-label="What do you want to do" autocomplete="off">
          <button class="primary-button" data-i18n="go">Go</button>
        </form>
        <div id="results" class="results"></div>
        <p id="source" class="source"></p>
      </section>

      <section class="card">
        <div class="section-heading">
          <span class="step">2</span>
          <div><h2 data-i18n="actions">Main actions</h2><p id="siteTitle" class="site"></p></div>
        </div>
        <div id="buttons" class="action-grid"></div>
        <button id="deeper" class="deep-button hidden"><span data-i18n="deeper">Missing something? Look deeper</span> <span data-i18n="deeper_sub">(takes up to a minute)</span></button>
      </section>
    </div>
  </main>
</div>

    thinking:'생각 중…', no_actions:'명확한 작업을 찾지 못했습니다. 위 입력창을 이용해 보세요.',
    back:'뒤로', back_hint:'주요 작업으로 돌아가기', pages:'{n}개 페이지', search_label:'“{q}” 검색', search_hint:'이 사이트에서 검색',
    matched_ai:'AI로 찾음', matched_kw:'키워드로 찾음', picked_ai:'(버튼은 AI가 선택)',
    err_side:'TAP.com 측에서 오류가 발생했습니다(코드 {c}). 터미널 창에서 오류를 확인하세요.',
    err_reach:'TAP.com에 연결할 수 없거나 시간이 너무 오래 걸립니다. 터미널에서 "python3 app.py"가 실행 중인가요?',
    err_generic:'오류가 발생했습니다. 터미널 창에서 확인하세요.'},
};

const lang = () => $('lang').value;
const tr = (k, subs) => Object.entries(subs || {}).reduce(
  (s, [p, v]) => s.replaceAll('{' + p + '}', v),
  (I18N[lang()] || {})[k] ?? EN[k]);

// Translate TAP's own interface. Unknown keys fall back to English, so a
// missing translation can never break the page.
function applyPageLang() {
  document.documentElement.lang = lang() || 'en';
  document.documentElement.dir = (lang() === 'ar' || lang() === 'ur') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = tr(el.dataset.i18nPh); });
}

// Wrap a link in Google Translate when a language is picked. If the site cannot
// be translated, Google's page offers the original — and 'Original' always works.
function translated(url) {
  const lang = $('lang').value;
  if (!lang || !/^https?:/i.test(url)) return url;
  return `https://translate.google.com/translate?sl=auto&tl=${lang}&u=${encodeURIComponent(url)}`;
}

function bigButton(b, compact = false) {
  const a = document.createElement('a');
  a.className = compact ? 'action-card compact' : 'action-card';
  a.href = translated(b.url); a.target = '_blank'; a.rel = 'noopener';
  a.title = b.hint || b.url;
  a.innerHTML = '<span class="action-symbol"></span><span class="action-label"><span></span></span>';
  a.firstChild.textContent = b.icon || '➡️';
  a.lastChild.firstChild.textContent = b.label;
  if (b.small) { const s = document.createElement('small'); s.textContent = b.small; a.lastChild.appendChild(s); }
  return a;
}

// Priority buttons: a button with 4+ pages shows its pages; otherwise it opens the page directly.
function priorityButton(b) {
  const many = b.pages && b.pages.length >= 4;
  const a = bigButton(many ? {...b, small: tr('pages', {n: b.pages.length})} : b);
  if (many) a.onclick = e => { e.preventDefault(); showPages(b); };
  return a;
}

function showButtons(list) {
  $('buttons').innerHTML = '';
  if (!list.length) $('buttons').textContent = tr('no_actions');
  list.forEach(b => $('buttons').appendChild(priorityButton(b)));
}

function showPages(b) {
  $('buttons').innerHTML = '';
  const back = bigButton({label: tr('back'), icon: '⬅️', url: '#', hint: tr('back_hint'), small: b.label});
  back.removeAttribute('target');
  back.onclick = e => { e.preventDefault(); showButtons(site.buttons); };
  $('buttons').appendChild(back);
  b.pages.forEach(p => $('buttons').appendChild(bigButton({label: p.label, icon: b.icon, url: p.url, hint: p.hint})));
}

async function loadSite(url, deep = false) {
  $('error').textContent = ''; $('deeper').classList.add('hidden');$('panel').classList.remove('hidden'); $('results').innerHTML = '';$('source').textContent = '';
  const started = Date.now();
  const say = () => $('buttons').textContent =
    tr('reading', {s: Math.round((Date.now() - started) / 1000)});
  say(); const timer = setInterval(say, 1000);
  let r, data;
  try {
    r = await fetch('/api/analyze', {method:'POST', headers:{'Content-Type':'application/json'},
                                   body: JSON.stringify({url, deep}), signal: AbortSignal.timeout(240000)});
    data = await r.json();
  } catch (e) {
    data = {error: r ? tr('err_side', {c: r.status}) : tr('err_reach')};
    r = {ok: false};
  } finally { clearInterval(timer); }
  if (!r.ok) { $('panel').classList.add('hidden');$('error').textContent = data.error; return; }
  site = data;
  $('siteTitle').textContent = `${data.title} — ${data.url}` + (data.ai ? '  ' + tr('picked_ai') : '') + (data.ai_note ? '  — ' + data.ai_note : '');
  showButtons(data.buttons);
  if (data.can_deep) $('deeper').classList.remove('hidden');$('ask').focus();
}

async function ask(query) {
  if (!site || !query.trim()) return;
  $('results').innerHTML = tr('thinking');
  const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({query, links: site.links, url: site.url, search_form: site.search_form})});
  let data;
  try { data = await r.json(); } catch (e) { $('results').textContent = tr('err_generic'); return; }
  $('results').innerHTML = '';
  data.results.forEach((b, i) => $('results').appendChild(
    bigButton({...b, icon: i === data.results.length - 1 ? '🔍' : '👉', small: b.hint}, true)));
  $('source').textContent = (data.source === 'ai' ? tr('matched_ai') : tr('matched_kw')) + (data.ai_note ? ' — ' + data.ai_note : '');
}

$('lang').onchange = () => {
  applyPageLang();                        // translate TAP itself
  if (site) showButtons(site.buttons);    // rebuild links in the new language
};
$('deeper').onclick = () => loadSite(site.url, true);
$('siteForm').onsubmit = e => { e.preventDefault(); loadSite($('url').value); };
$('askForm').onsubmit  = e => { e.preventDefault(); ask($('ask').value); };
// Shareable link: /?site=example.com opens straight into the simple view.
const preset = new URLSearchParams(location.search).get('site');
if (preset) { $('url').value = preset; loadSite(preset); }
document.querySelectorAll('.chip').forEach(c =>
  c.onclick = () => { $('url').value = c.dataset.url; loadSite(c.dataset.url); });
</script>
</body>
